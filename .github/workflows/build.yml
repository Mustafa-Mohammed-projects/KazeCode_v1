name: Build KazeCode APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a Python on the build machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # OPTIONAL: bundle a PHP CLI binary (arm64) so PHP files can run.
      # Set a repository variable PHP_BINARY_URL (Settings > Secrets and variables > Actions > Variables)
      - name: Fetch PHP runtime (optional)
        env:
          PHP_BINARY_URL: ${{ vars.PHP_BINARY_URL }}
        run: |
          if [ -n "$PHP_BINARY_URL" ]; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            curl -fsSL "$PHP_BINARY_URL" -o app/src/main/jniLibs/arm64-v8a/libphp.so
            echo "PHP runtime bundled"
          else
            echo "PHP_BINARY_URL not set - building without PHP runtime"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KazeCode-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
